<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #050505; color: white; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #333;
        }
        button {
            padding: 10px 18px;
            cursor: pointer;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: bold;
        }
        button:hover { background: #333; border-color: #666; }
        button.active { background: #007bff; border-color: #0056b3; box-shadow: 0 0 10px rgba(0, 123, 255, 0.5); }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3 style="margin:0 0 10px 0; color: #007bff;">3D Explorer</h3>
        <button id="btn-glb" class="active">GLB Model</button>
        <button id="btn-ply">PLY Model</button>
        <div style="font-size: 11px; opacity: 0.6; margin-top: 10px; line-height: 1.4;">
            <b>Rotate:</b> Left Click<br>
            <b>Pan:</b> Right Click<br>
            <b>Zoom:</b> Scroll
        </div>
    </div>
    <div id="loading">Loading assets...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        let scene, camera, renderer, controls, currentModel;
        const loaderGLB = new GLTFLoader();
        const loaderPLY = new PLYLoader();
        const loadingEl = document.getElementById('loading');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 2.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            scene.add(hemisphereLight);

            // Dynamic Spotlights for "Pop"
            const spotLight1 = new THREE.SpotLight(0xffffff, 100);
            spotLight1.position.set(5, 10, 5);
            spotLight1.angle = Math.PI / 6;
            spotLight1.penumbra = 0.3;
            spotLight1.decay = 2;
            spotLight1.distance = 50;
            spotLight1.castShadow = true;
            scene.add(spotLight1);

            const spotLight2 = new THREE.SpotLight(0x007bff, 80); // Blueish highlight
            spotLight2.position.set(-5, 5, -5);
            spotLight2.angle = Math.PI / 4;
            spotLight2.penumbra = 0.5;
            scene.add(spotLight2);

            const spotLight3 = new THREE.SpotLight(0xffaa00, 50); // Warm backlight
            spotLight3.position.set(0, 10, -10);
            spotLight3.angle = Math.PI / 3;
            scene.add(spotLight3);

            loadGLB();

            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('btn-glb').onclick = (e) => {
                setActive(e.target);
                loadGLB();
            };
            document.getElementById('btn-ply').onclick = (e) => {
                setActive(e.target);
                loadPLY();
            };

            animate();
        }

        function setActive(btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function clearModel() {
            if (currentModel) {
                scene.remove(currentModel);
                // Recursively dispose
                currentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry.dispose();
                        if (child.material.isMaterial) {
                            cleanMaterial(child.material);
                        } else if (Array.isArray(child.material)) {
                            child.material.forEach(cleanMaterial);
                        }
                    }
                });
            }
        }

        function cleanMaterial(material) {
            material.dispose();
            for (const key of Object.keys(material)) {
                if (material[key] && material[key].isTexture) {
                    material[key].dispose();
                }
            }
        }

        function centerModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 2.2; 
            camera.position.set(cameraZ * 0.5, cameraZ * 0.5, cameraZ);
            
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function loadGLB() {
            clearModel();
            loadingEl.style.display = 'block';
            loaderGLB.load('sample.glb', (gltf) => {
                currentModel = gltf.scene;
                currentModel.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
                scene.add(currentModel);
                centerModel(currentModel);
                loadingEl.style.display = 'none';
            }, undefined, (error) => {
                console.error(error);
                loadingEl.innerText = 'Error loading GLB';
            });
        }

        function loadPLY() {
            clearModel();
            loadingEl.style.display = 'block';
            loaderPLY.load('sample.ply', (geometry) => {
                geometry.computeVertexNormals();
                
                const hasColors = geometry.hasAttribute('color');
                const material = new THREE.MeshStandardMaterial({ 
                    vertexColors: hasColors,
                    color: hasColors ? 0xffffff : 0xcccccc, 
                    roughness: 0.4,
                    metalness: 0.2
                });
                
                currentModel = new THREE.Mesh(geometry, material);
                currentModel.castShadow = true;
                currentModel.receiveShadow = true;
                
                if (geometry.index === null && (!geometry.attributes.index || geometry.attributes.index.count === 0)) {
                     const pointsMaterial = new THREE.PointsMaterial({ size: 0.05, vertexColors: hasColors });
                     currentModel = new THREE.Points(geometry, pointsMaterial);
                }

                scene.add(currentModel);
                centerModel(currentModel);
                loadingEl.style.display = 'none';
            }, undefined, (error) => {
                console.error(error);
                loadingEl.innerText = 'Error loading PLY';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
