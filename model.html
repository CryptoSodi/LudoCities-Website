<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: white; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { background: #666; }
        button.active { background: #007bff; border-color: #0056b3; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3 style="margin:0 0 10px 0">3D Viewer</h3>
        <button id="btn-glb" class="active">Show GLB (sample.glb)</button>
        <button id="btn-ply">Show PLY (sample.ply)</button>
        <div style="font-size: 12px; opacity: 0.7;">Left click: Rotate<br>Right click: Pan<br>Scroll: Zoom</div>
    </div>
    <div id="loading">Loading model...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        let scene, camera, renderer, controls, currentModel;
        const loaderGLB = new GLTFLoader();
        const loaderPLY = new PLYLoader();
        const loadingEl = document.getElementById('loading');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            loadGLB();

            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('btn-glb').onclick = (e) => {
                setActive(e.target);
                loadGLB();
            };
            document.getElementById('btn-ply').onclick = (e) => {
                setActive(e.target);
                loadPLY();
            };

            animate();
        }

        function setActive(btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function clearModel() {
            if (currentModel) {
                scene.remove(currentModel);
                // Dispose resources if necessary
            }
        }

        function centerModel(model) {
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            
            model.position.x += (model.position.x - center.x);
            model.position.y += (model.position.y - center.y);
            model.position.z += (model.position.z - center.z);
            
            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
            cameraZ *= 1.5; // Zoom out a bit
            camera.position.z = cameraZ;
            
            controls.update();
        }

        function loadGLB() {
            clearModel();
            loadingEl.style.display = 'block';
            loaderGLB.load('sample.glb', (gltf) => {
                currentModel = gltf.scene;
                scene.add(currentModel);
                centerModel(currentModel);
                loadingEl.style.display = 'none';
            }, undefined, (error) => {
                console.error(error);
                loadingEl.innerText = 'Error loading GLB';
            });
        }

        function loadPLY() {
            clearModel();
            loadingEl.style.display = 'block';
            loaderPLY.load('sample.ply', (geometry) => {
                geometry.computeVertexNormals();
                const material = new THREE.MeshStandardMaterial({ color: 0x00aaff, flatShading: true });
                currentModel = new THREE.Mesh(geometry, material);
                
                // If it's a point cloud (no faces), use points instead
                if (geometry.index === null && geometry.attributes.position.count > 0) {
                     const pointsMaterial = new THREE.PointsMaterial({ size: 0.01, vertexColors: geometry.hasAttribute('color') });
                     currentModel = new THREE.Points(geometry, pointsMaterial);
                }

                scene.add(currentModel);
                centerModel(currentModel);
                loadingEl.style.display = 'none';
            }, undefined, (error) => {
                console.error(error);
                loadingEl.innerText = 'Error loading PLY';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
