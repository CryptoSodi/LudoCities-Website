<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #remoteVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        #debugLog {
            position: fixed;
            right: 8px;
            bottom: 8px;
            width: min(46vw, 520px);
            max-height: 42vh;
            overflow: auto;
            background: rgba(0,0,0,0.72);
            color: #7CFC00;
            font-family: Consolas, monospace;
            font-size: 11px;
            padding: 8px;
            border: 1px solid #444;
            z-index: 9999;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<video id="remoteVideo" autoplay playsinline muted></video>
<div id="debugLog"></div>

<script>
const remoteVideo = document.getElementById('remoteVideo');
const debugLogEl = document.getElementById('debugLog');
const qs = new URLSearchParams(window.location.search);
const hs = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
const roomId = ((qs.get("roomId") || hs.get("roomId") || "")).trim();
const selfId = ((qs.get("playerColor") || hs.get("playerColor") || "")).trim().toLowerCase();
const apiBase = (qs.get("apiBase") || hs.get("apiBase") || "https://api.ludocities.com/api/webrtc").trim().replace(/\/$/, "");
const debugParam = (qs.get("debug") || hs.get("debug") || "").trim().toLowerCase();
const showDebug = debugParam === "1" || debugParam === "true" || debugParam === "yes";
const processedOffers = new Set();
let wasOffline = false;
if (debugLogEl) debugLogEl.style.display = showDebug ? "block" : "none";
function log(msg) {
    const line = `[${new Date().toISOString().slice(11, 19)}] ${msg}`;
    console.log(line);
    if (!showDebug || !debugLogEl) return;
    debugLogEl.textContent = `${line}\n${debugLogEl.textContent}`.slice(0, 8000);
}
log(`Receiver boot room=${roomId || "?"} self=${selfId || "?"} api=${apiBase}`);
window.addEventListener("offline", () => {
    wasOffline = true;
    log("Network offline.");
});
window.addEventListener("online", () => {
    log("Network online. Resetting receiver peer.");
    resetPeer("online");
});

let pc = null;
let currentOfferHash = "";
let currentOfferOwner = "";
function wirePcEvents(peer) {
    peer.ontrack = async event => {
        remoteVideo.srcObject = event.streams[0];
        try {
            await remoteVideo.play();
            log("Remote video track received and playing.");
        } catch (e) {
            log(`remoteVideo.play blocked: ${e?.message || e}`);
        }
    };
    peer.onicecandidate = event => {
        if (!event.candidate) {
            log("All ICE candidates gathered.");
            const answerJson = JSON.stringify(peer.localDescription || {});
            log(`Answer updated length=${answerJson.length}`);
        }
    };
    peer.onconnectionstatechange = () => {
        log(`PC connectionState=${peer.connectionState}`);
    };
    peer.oniceconnectionstatechange = () => {
        log(`PC iceConnectionState=${peer.iceConnectionState}`);
    };
}
function createPeer() {
    const peer = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    wirePcEvents(peer);
    return peer;
}
function resetPeer(reason) {
    try {
        if (pc) pc.close();
    } catch {}
    pc = createPeer();
    log(`PC reset. reason=${reason}`);
}
function hashString(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
    }
    return (h >>> 0).toString(16);
}
resetPeer("boot");


async function createAnswer(offerString) {
    offerString = offerString.replace(/\r/g, "\\r").replace(/\n/g, "\\n");
    const offer = JSON.parse(offerString);
    if (!pc) resetPeer("createAnswer-no-pc");

    // If peer is in a bad state from previous match/negotiation, recreate.
    if (pc.signalingState === "closed" || pc.connectionState === "failed") {
        resetPeer("bad-state");
    }

    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    const answerJson = JSON.stringify(pc.localDescription || {});
    log(`Answer created length=${answerJson.length}`);
    await waitForIceGatheringComplete(pc);
    
    // ✅ Return the *complete* answer JSON
    const finalAnswer = JSON.stringify(pc.localDescription);
    log(`Answer ready length=${finalAnswer.length}`);
    return finalAnswer;
}
function getAnswer() {
    if (pc && pc.localDescription)
        return JSON.stringify(pc.localDescription);
    return "";
}
// ✅ This Promise resolves once ICE gathering is complete
function waitForIceGatheringComplete(pc) {
    return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") {
            resolve();
        } else {
            const checkState = () => {
                if (pc.iceGatheringState === "complete") {
                    pc.removeEventListener("icegatheringstatechange", checkState);
                    resolve();
                }
            };
            pc.addEventListener("icegatheringstatechange", checkState);
        }
    });
}

async function pullAllOffers() {
    const response = await fetch(`${apiBase}/offers?roomId=${encodeURIComponent(roomId)}`);
    if (!response.ok) {
        log(`GET offers => ${response.status}`);
        return [];
    }
    const data = await response.json();
    log(`GET offers => ${response.status}, count=${Array.isArray(data) ? data.length : 0}`);
    return data;
}

async function upsertAnswer(ownerClientId, answerJson) {
    const response = await fetch(`${apiBase}/answers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            roomId,
            playerColor: selfId,
            targetPlayerColor: ownerClientId,
            answerJson
        })
    });
    log(`POST answers => ${response.status} owner=${ownerClientId}`);
}

async function exchangeTick() {
    if (!roomId || !selfId) return;
    if (!navigator.onLine) return;
    if (wasOffline) {
        wasOffline = false;
        resetPeer("after-offline");
    }
    const offerEnvelopes = await pullAllOffers();
    for (const envelope of offerEnvelopes) {
        const ownerClientId = (envelope.playerColor || "").toLowerCase();
        if (!ownerClientId || ownerClientId === selfId) continue;

        let parsed;
        try {
            parsed = JSON.parse(envelope.offersJson || "[]");
        } catch {
            continue;
        }
        if (!Array.isArray(parsed)) continue;

        const mine = parsed.find(x => (x?.clientId || "").toLowerCase() === selfId && x?.offer);
        if (!mine) continue;

        const sdp = mine.offer?.sdp || "";
        const sdpHash = hashString(sdp);
        const dedupKey = `${roomId}:${ownerClientId}:${selfId}:${sdpHash}`;
        if (processedOffers.has(dedupKey)) continue;

        if (!pc || currentOfferOwner !== ownerClientId || currentOfferHash !== sdpHash) {
            resetPeer("new-offer");
            currentOfferOwner = ownerClientId;
            currentOfferHash = sdpHash;
        }

        const answer = await createAnswer(JSON.stringify(mine.offer));
        if (!answer) continue;
        await upsertAnswer(ownerClientId, answer);
        processedOffers.add(dedupKey);
        log(`Answer pushed owner=${ownerClientId}, responder=${selfId}`);
    }
}
async function runLoop() {
    try {
        await exchangeTick();
    } catch (err) {
        log(`[WebRTC][Receiver] Tick error: ${err?.message || err}`);
    } finally {
        const connected = pc && (pc.connectionState === "connected" || pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed");
        const nextMs = connected ? 7000 : 1800;
        setTimeout(runLoop, nextMs);
    }
}
runLoop();
</script>
</body>
</html>
