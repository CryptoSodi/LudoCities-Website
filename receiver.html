<!DOCTYPE html>
<html>
<head>
    <style>
        #debugLog {
            position: fixed;
            right: 8px;
            bottom: 8px;
            width: min(46vw, 520px);
            max-height: 42vh;
            overflow: auto;
            background: rgba(0,0,0,0.72);
            color: #7CFC00;
            font-family: Consolas, monospace;
            font-size: 11px;
            padding: 8px;
            border: 1px solid #444;
            z-index: 9999;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<h2>Receiver</h2>
<video id="remoteVideo" autoplay playsinline muted></video>
<div id="debugLog"></div>
<textarea id="offer" cols="60" rows="10" placeholder="Paste offer here"></textarea>
<textarea id="answer" cols="60" rows="10" placeholder="Answer will appear here"></textarea>
<button id="setOffer">Set Offer</button>
<button id="createAnswer">Create Answer</button>

<script>
const remoteVideo = document.getElementById('remoteVideo');
const debugLogEl = document.getElementById('debugLog');
const offerTextarea = document.getElementById('offer');
const answerTextarea = document.getElementById('answer');
const qs = new URLSearchParams(window.location.search);
const hs = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
const roomId = ((qs.get("roomId") || hs.get("roomId") || "")).trim();
const selfId = ((qs.get("playerColor") || hs.get("playerColor") || "")).trim().toLowerCase();
const apiBase = (qs.get("apiBase") || hs.get("apiBase") || "https://api.ludocities.com/api/webrtc").trim().replace(/\/$/, "");
const processedOffers = new Set();
function log(msg) {
    const line = `[${new Date().toISOString().slice(11, 19)}] ${msg}`;
    console.log(line);
    if (!debugLogEl) return;
    debugLogEl.textContent = `${line}\n${debugLogEl.textContent}`.slice(0, 8000);
}
log(`Receiver boot room=${roomId || "?"} self=${selfId || "?"} api=${apiBase}`);

let pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

pc.ontrack = async event => { remoteVideo.srcObject = event.streams[0]; try { await remoteVideo.play(); log("Remote video track received and playing."); } catch (e) { log(`remoteVideo.play blocked: ${e?.message || e}`); } };

pc.onicecandidate = event => {
    if (!event.candidate) {
        log("All ICE candidates gathered.");
        answerTextarea.value = JSON.stringify(pc.localDescription);
        log(`Answer textarea updated length=${answerTextarea.value.length}`);
    }
};

document.getElementById('setOffer').onclick = async () => {
    const offer = JSON.parse(offerTextarea.value);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    answerTextarea.value = JSON.stringify(pc.localDescription);
        console.log("CCCCCC : "+answerTextarea.value);
};

document.getElementById('createAnswer').onclick = async () => {
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    answerTextarea.value = JSON.stringify(pc.localDescription);
};


async function createAnswer(offerString) {
    offerString = offerString.replace(/\r/g, "\\r").replace(/\n/g, "\\n");
    const offer = JSON.parse(offerString);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    answerTextarea.value = JSON.stringify(pc.localDescription);
    log(`Answer created length=${answerTextarea.value.length}`);
    await waitForIceGatheringComplete(pc);
    
    // ✅ Return the *complete* answer JSON
    const finalAnswer = JSON.stringify(pc.localDescription);
    log(`Answer ready length=${finalAnswer.length}`);
    return finalAnswer;
}
function getAnswer() {
    if (answerTextarea && answerTextarea.value)
        return answerTextarea.value;
    if (pc && pc.localDescription)
        return JSON.stringify(pc.localDescription);
    return "";
}
// ✅ This Promise resolves once ICE gathering is complete
function waitForIceGatheringComplete(pc) {
    return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") {
            resolve();
        } else {
            const checkState = () => {
                if (pc.iceGatheringState === "complete") {
                    pc.removeEventListener("icegatheringstatechange", checkState);
                    resolve();
                }
            };
            pc.addEventListener("icegatheringstatechange", checkState);
        }
    });
}

async function pullAllOffers() {
    const response = await fetch(`${apiBase}/offers?roomId=${encodeURIComponent(roomId)}`);
    if (!response.ok) {
        log(`GET offers => ${response.status}`);
        return [];
    }
    const data = await response.json();
    log(`GET offers => ${response.status}, count=${Array.isArray(data) ? data.length : 0}`);
    return data;
}

async function upsertAnswer(ownerClientId, answerJson) {
    const response = await fetch(`${apiBase}/answers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            roomId,
            playerColor: selfId,
            targetPlayerColor: ownerClientId,
            answerJson
        })
    });
    log(`POST answers => ${response.status} owner=${ownerClientId}`);
}

async function exchangeTick() {
    if (!roomId || !selfId) return;
    const offerEnvelopes = await pullAllOffers();
    for (const envelope of offerEnvelopes) {
        const ownerClientId = (envelope.playerColor || "").toLowerCase();
        if (!ownerClientId || ownerClientId === selfId) continue;

        let parsed;
        try {
            parsed = JSON.parse(envelope.offersJson || "[]");
        } catch {
            continue;
        }
        if (!Array.isArray(parsed)) continue;

        const mine = parsed.find(x => (x?.clientId || "").toLowerCase() === selfId && x?.offer);
        if (!mine) continue;

        const sdp = mine.offer?.sdp || "";
        const dedupKey = `${roomId}:${ownerClientId}:${selfId}:${sdp.length}`;
        if (processedOffers.has(dedupKey)) continue;

        const answer = await createAnswer(JSON.stringify(mine.offer));
        if (!answer) continue;
        await upsertAnswer(ownerClientId, answer);
        processedOffers.add(dedupKey);
        log(`Answer pushed owner=${ownerClientId}, responder=${selfId}`);
    }
}

setInterval(() => {
    exchangeTick().catch(err => log(`[WebRTC][Receiver] Tick error: ${err?.message || err}`));
}, 1800);
</script>
</body>
</html>
