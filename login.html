<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Cities | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Orbitron', sans-serif; background-color: #111827; }
        h1 { font-family: 'Press Start 2P', cursive; }
    </style>
    <!-- Google Login SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    
    <div class="max-w-md w-full bg-gray-800/50 backdrop-blur-xl p-10 rounded-2xl border border-purple-500/30 shadow-2xl text-center">
        <img src="images/logo.png" alt="Ludo Cities" class="h-24 mx-auto mb-6">
        <h1 class="text-2xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">Ludo Cities</h1>
        <p class="text-gray-400 mb-10 tracking-widest text-sm">WEB3 GAMING EVOLVED</p>

        <div id="g_id_onload"
             data-client_id="973406093603-t7b4fbs99ouvg6u4hud80s3b64eek5qt.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin flex justify-center"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="pill"
             data-logo_alignment="left">
        </div>

        <p id="error-message" class="mt-6 text-red-400 text-sm hidden"></p>
        <div id="loading-spinner" class="mt-6 hidden">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 mx-auto"></div>
            <p class="text-gray-500 text-xs mt-2">Authenticating with Ludo API...</p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
