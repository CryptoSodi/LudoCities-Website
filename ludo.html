<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ============================================ -->
    <!-- CHANGE THE URL BELOW TO UPDATE REDIRECT     -->

    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.ludoengine.ludocities">
    
    <script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            text-align: center;

        .loader {
            width: 40px;

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #64b5f6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
