<!DOCTYPE html>
<html>
<head>
    <style>
html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: black; 
       }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
<video id="localVideo" autoplay playsinline muted width="400"></video>
<div id="offers"></div>
<script>
const localVideo = document.getElementById('localVideo');
let localStream = null;
const qs = new URLSearchParams(window.location.search);
const roomCode = (qs.get("roomCode") || "").trim();
const selfId = (qs.get("selfId") || "").trim().toLowerCase();
const apiBase = `${window.location.origin}/api/gameplay/webrtc/public`;
const pcs = {};
const appliedAnswers = new Set();

navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
    localVideo.srcObject = stream;
    localStream = stream;
});

function waitForIceGatheringComplete(pc) {
    return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") {
            resolve();
        } else {
            const checkState = () => {
                if (pc.iceGatheringState === "complete") {
                    pc.removeEventListener("icegatheringstatechange", checkState);
                    resolve();
                }
            };
            pc.addEventListener("icegatheringstatechange", checkState);
        }
    });
}

async function initLocalStream() {
    if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const video = document.getElementById('localVideo');
        if (video) video.srcObject = localStream;
    }
    return localStream;
}

async function createOffersForClients(clientIdsCsv) {
    const ids = clientIdsCsv.split(",").map(x => x.trim()).filter(x => x);
    const offers = [];
    const stream = await initLocalStream();

    for (const id of ids) {
        if (pcs[id]) {
            console.log(`⚠️ PeerConnection for ${id} already exists — skipping.`);
            continue;
        }

        const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });
        pcs[id] = pc;
        stream.getTracks().forEach(track => pc.addTrack(track, stream));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIceGatheringComplete(pc);
        // Push plain JS object (not stringified)
        offers.push({
            clientId: id,
            offer: pc.localDescription
        });
    }
    
    // Return clean JSON for copy/paste
    
    const result = JSON.stringify(offers, null, 2);
    console.log("🎯 Offers JSON:\n", result);
    return result;
}

async function setAnswerForClient(clientId, answerJson) {
    answerJson = answerJson.replace(/\r/g, "\\r").replace(/\n/g, "\\n");
    const pc = pcs[clientId];
    if (!pc) {
        console.error(`❌ No PeerConnection for ${clientId}`);
        return;
    }
    try {
                const answer = JSON.parse(answerJson);
                await pc.setRemoteDescription(answer); // ✅ Don't wrap it in RTCSessionDescription
                
                console.log(`✅ Answer set for ${clientId}`);
    } catch (err) {
        console.error(`⚠️ Failed to set answer for ${clientId}:`, err);
    }
}

function getTargetIds() {
    const all = ["red", "green", "yellow", "blue"];
    return all.filter(x => x !== selfId);
}

async function upsertOffers(offersJson) {
    await fetch(`${apiBase}/offers`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-client-id": selfId },
        body: JSON.stringify({ roomCode, ownerClientId: selfId, offersJson })
    });
}

async function pullAnswers() {
    const response = await fetch(`${apiBase}/answers?roomCode=${encodeURIComponent(roomCode)}&ownerClientId=${encodeURIComponent(selfId)}`, {
        headers: { "x-client-id": selfId }
    });
    if (!response.ok) return [];
    return await response.json();
}

async function exchangeTick() {
    if (!roomCode || !selfId) return;
    const targetIds = getTargetIds();
    if (targetIds.length === 0) return;

    const offersJson = await createOffersForClients(targetIds.join(","));
    if (offersJson) await upsertOffers(offersJson);

    const answers = await pullAnswers();
    for (const item of answers) {
        const responder = (item.responderClientId || "").toLowerCase();
        if (!responder) continue;
        const key = `${selfId}:${responder}:${item.updatedUtc || ""}`;
        if (appliedAnswers.has(key)) continue;
        await setAnswerForClient(responder, item.answerJson || "");
        appliedAnswers.add(key);
    }
}

setInterval(() => {
    exchangeTick().catch(err => console.error("[WebRTC][Broadcaster] Tick error:", err));
}, 1800);
</script>
</body>
</html>
