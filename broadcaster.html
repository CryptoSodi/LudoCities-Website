<!DOCTYPE html>
<html>
<head>
    <style>
html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: black; 
       }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #debugLog {
            position: fixed;
            right: 8px;
            bottom: 8px;
            width: min(46vw, 520px);
            max-height: 42vh;
            overflow: auto;
            background: rgba(0,0,0,0.72);
            color: #7CFC00;
            font-family: Consolas, monospace;
            font-size: 11px;
            padding: 8px;
            border: 1px solid #444;
            z-index: 9999;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<video id="localVideo" autoplay playsinline muted width="400"></video>
<div id="debugLog"></div>
<script>
const localVideo = document.getElementById('localVideo');
const debugLogEl = document.getElementById('debugLog');
let localStream = null;
const qs = new URLSearchParams(window.location.search);
const hs = new URLSearchParams((window.location.hash || "").replace(/^#/, ""));
const roomId = ((qs.get("roomId") || hs.get("roomId") || "")).trim();
const selfId = ((qs.get("playerColor") || hs.get("playerColor") || "")).trim().toLowerCase();
const apiBase = (qs.get("apiBase") || hs.get("apiBase") || "https://api.ludocities.com/api/webrtc").trim().replace(/\/$/, "");
const debugParam = (qs.get("debug") || hs.get("debug") || "").trim().toLowerCase();
const showDebug = debugParam === "1" || debugParam === "true" || debugParam === "yes";
let pcs = {};
const appliedAnswers = new Set();
let wasOffline = false;
if (debugLogEl) debugLogEl.style.display = showDebug ? "block" : "none";
function log(msg) {
    const line = `[${new Date().toISOString().slice(11, 19)}] ${msg}`;
    console.log(line);
    if (!showDebug || !debugLogEl) return;
    debugLogEl.textContent = `${line}\n${debugLogEl.textContent}`.slice(0, 8000);
}
log(`Broadcaster boot room=${roomId || "?"} self=${selfId || "?"} api=${apiBase}`);
window.addEventListener("offline", () => {
    wasOffline = true;
    log("Network offline.");
});
window.addEventListener("online", () => {
    log("Network online. Resetting peer connections for clean renegotiation.");
    resetAllPeers("online");
});

navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
    localVideo.srcObject = stream;
    localStream = stream;
    log("Local media stream acquired.");
}).catch(err => {
    log(`getUserMedia failed: ${err?.message || err}`);
});

function waitForIceGatheringComplete(pc) {
    return new Promise(resolve => {
        if (pc.iceGatheringState === "complete") {
            resolve();
        } else {
            const checkState = () => {
                if (pc.iceGatheringState === "complete") {
                    pc.removeEventListener("icegatheringstatechange", checkState);
                    resolve();
                }
            };
            pc.addEventListener("icegatheringstatechange", checkState);
        }
    });
}

async function initLocalStream() {
    if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const video = document.getElementById('localVideo');
        if (video) video.srcObject = localStream;
    }
    return localStream;
}

async function createOffersForClients(clientIdsCsv) {
    const ids = clientIdsCsv.split(",").map(x => x.trim()).filter(x => x);
    const offers = [];
    const stream = await initLocalStream();

    for (const id of ids) {
        if (pcs[id]) {
            log(`PeerConnection for ${id} already exists, reusing existing localDescription.`);
            if (pcs[id].localDescription) {
                offers.push({
                    clientId: id,
                    offer: pcs[id].localDescription
                });
            }
            continue;
        }

        const pc = new RTCPeerConnection({
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });
        pcs[id] = pc;
        stream.getTracks().forEach(track => pc.addTrack(track, stream));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIceGatheringComplete(pc);
        // Push plain JS object (not stringified)
        offers.push({
            clientId: id,
            offer: pc.localDescription
        });
    }
    
    // Return clean JSON for copy/paste
    
    const result = JSON.stringify(offers, null, 2);
    log(`Offers created count=${offers.length}`);
    return result;
}

async function setAnswerForClient(clientId, answerJson) {
    answerJson = answerJson.replace(/\r/g, "\\r").replace(/\n/g, "\\n");
    const pc = pcs[clientId];
    if (!pc) {
        log(`No PeerConnection for ${clientId}`);
        return;
    }
    try {
                const answer = JSON.parse(answerJson);
                await pc.setRemoteDescription(answer); // ✅ Don't wrap it in RTCSessionDescription
                log(`Answer applied for ${clientId}`);
    } catch (err) {
        log(`Failed to set answer for ${clientId}: ${err?.message || err}`);
    }
}

function getTargetIds() {
    const all = ["red", "green", "yellow", "blue"];
    return all.filter(x => x !== selfId);
}
function isPcConnected(pc) {
    if (!pc) return false;
    const c = pc.connectionState;
    const i = pc.iceConnectionState;
    return c === "connected" || i === "connected" || i === "completed";
}
function resetAllPeers(reason) {
    Object.keys(pcs).forEach(id => {
        try { pcs[id].close(); } catch {}
    });
    pcs = {};
    appliedAnswers.clear();
    log(`All peers reset. reason=${reason}`);
}

async function upsertOffers(offersJson) {
    const response = await fetch(`${apiBase}/offers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomId, playerColor: selfId, offersJson })
    });
    log(`POST offers => ${response.status}`);
}

async function pullAnswers() {
    const response = await fetch(`${apiBase}/answers?roomId=${encodeURIComponent(roomId)}&playerColor=${encodeURIComponent(selfId)}`);
    if (!response.ok) {
        log(`GET answers => ${response.status}`);
        return [];
    }
    const data = await response.json();
    log(`GET answers => ${response.status}, count=${Array.isArray(data) ? data.length : 0}`);
    return data;
}

async function exchangeTick() {
    if (!roomId || !selfId) return;
    if (!navigator.onLine) return;
    if (wasOffline) {
        wasOffline = false;
        resetAllPeers("after-offline");
    }
    const targetIds = getTargetIds();
    if (targetIds.length === 0) {
        log("No target IDs.");
        return;
    }
    log(`Tick targets=${targetIds.join(",")}`);

    const pendingTargets = targetIds.filter(id => !isPcConnected(pcs[id]));
    if (pendingTargets.length === 0) {
        await pullAnswers();
        return;
    }
    const offersJson = await createOffersForClients(pendingTargets.join(","));
    if (!offersJson) return;

    let parsedOffers = [];
    try {
        parsedOffers = JSON.parse(offersJson);
    } catch {
        parsedOffers = [];
    }
    if (!Array.isArray(parsedOffers) || parsedOffers.length === 0) {
        log("No offers generated this tick. Skip POST to avoid overwriting valid offers with empty list.");
        return;
    }

    await upsertOffers(offersJson);

    const answers = await pullAnswers();
    for (const item of answers) {
        const responder = (item.playerColor || "").toLowerCase();
        if (!responder) continue;
        const key = `${roomId}:${selfId}:${responder}:${item.updatedUtc || ""}`;
        if (appliedAnswers.has(key)) continue;
        await setAnswerForClient(responder, item.answerJson || "");
        appliedAnswers.add(key);
        const pc = pcs[responder];
        if (pc) {
            pc.onconnectionstatechange = () => {
                log(`PC[${responder}] connectionState=${pc.connectionState}`);
                if (pc.connectionState === "failed" || pc.connectionState === "disconnected" || pc.connectionState === "closed") {
                    try { pc.close(); } catch {}
                    delete pcs[responder];
                    log(`PC[${responder}] dropped; will renegotiate.`);
                }
            };
            pc.oniceconnectionstatechange = () => {
                log(`PC[${responder}] iceConnectionState=${pc.iceConnectionState}`);
            };
        }
    }
}
async function runLoop() {
    try {
        await exchangeTick();
    } catch (err) {
        log(`[WebRTC][Broadcaster] Tick error: ${err?.message || err}`);
    } finally {
        const targetIds = getTargetIds();
        const pendingTargets = targetIds.filter(id => !isPcConnected(pcs[id]));
        const nextMs = pendingTargets.length === 0 ? 7000 : 1800;
        setTimeout(runLoop, nextMs);
    }
}
runLoop();
</script>
</body>
</html>
