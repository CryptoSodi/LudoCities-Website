    <title>FATASS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ff00ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
        }

        .fatass {
            font-size: 15vw;
            font-weight: 900;
            color: yellow;
            text-shadow: 
                5px 5px 0 #000,
                -5px -5px 0 #000,
                5px -5px 0 #000,
                -5px 5px 0 #000,
                10px 10px 20px rgba(0,0,0,0.5);
            animation: bounceAndGrow 0.8s infinite alternate ease-in-out;
            text-align: center;
        }

        @keyframes bounceAndGrow {
            0% {
                transform: scale(0.8) translateY(50px) rotate(-10deg);
                color: yellow;
            }
            50% {
                transform: scale(1.5) translateY(-20px) rotate(5deg);
                color: cyan;
            }
            100% {
                transform: scale(2.2) translateY(-50px) rotate(-15deg);
                color: #39ff14; /* Neon green */
            }
        }
        
        .subtext {
            position: absolute;
            bottom: 30px;
            font-size: 3vw;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            animation: blink 0.2s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; color: white; }
            50% { opacity: 0; color: red; }
        }
    </style>
</head>
<body>
    <div class="fatass">FATASS</div>
    <div class="subtext">FATY!</div>
    <audio id="bgMusic" loop>

    </audio>
    <script>
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('bgMusic');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>
