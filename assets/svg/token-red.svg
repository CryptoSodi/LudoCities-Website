<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Drop shadow -->
  <ellipse cx="40" cy="95" rx="22" ry="5" fill="black" opacity="0.25"/>
  <!-- Base ring shadow -->
  <ellipse cx="40" cy="80" rx="26" ry="9" fill="#7A0F1A"/>
  <!-- Base cylinder body -->
  <rect x="14" y="66" width="52" height="14" fill="#B32030"/>
  <!-- Base top ellipse -->
  <ellipse cx="40" cy="66" rx="26" ry="9" fill="#E63946"/>
  <!-- Neck -->
  <rect x="30" y="42" width="20" height="26" rx="3" fill="#CC2E3F"/>
  <!-- Neck highlight -->
  <rect x="32" y="42" width="8" height="26" rx="2" fill="#E63946" opacity="0.6"/>
  <!-- Head sphere bottom shadow -->
  <ellipse cx="40" cy="42" rx="22" ry="6" fill="#7A0F1A"/>
  <!-- Head sphere body -->
  <ellipse cx="40" cy="26" rx="22" ry="22" fill="#CC2E3F"/>
  <!-- Head sphere highlight top -->
  <ellipse cx="40" cy="18" rx="22" ry="16" fill="#E63946"/>
  <!-- Specular highlight -->
  <ellipse cx="32" cy="13" rx="8" ry="6" fill="white" opacity="0.28"/>
  <!-- Small top glint -->
  <ellipse cx="34" cy="11" rx="3" ry="2" fill="white" opacity="0.45"/>
</svg>
